<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Nova">
  <!-- Nova（共享端）：一颗把光发出去的新星。暖色取自共享端设计系统的 --gx-accent 一族。 -->
  <defs>
    <linearGradient id="nova-bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#e79a55"/>
      <stop offset="0.42" stop-color="#c05f26"/>
      <stop offset="1" stop-color="#83360f"/>
    </linearGradient>
    <radialGradient id="nova-lit" cx="0.28" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nova-shade" cx="0.68" cy="1.02" r="0.9">
      <stop offset="0" stop-color="#4a1803" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4a1803" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nova-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4e6" stop-opacity="0.62"/>
      <stop offset="0.38" stop-color="#ffd8ab" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffd8ab" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nova-star" x1="0.22" y1="0.04" x2="0.78" y2="0.96">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe6cd"/>
    </linearGradient>
    <linearGradient id="nova-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="229" fill="url(#nova-bg)"/>
  <rect width="1024" height="1024" rx="229" fill="url(#nova-shade)"/>
  <rect width="1024" height="1024" rx="229" fill="url(#nova-lit)"/>

  <circle cx="512" cy="512" r="330" fill="url(#nova-glow)"/>

  <g fill="url(#nova-star)">
    <!-- 四道长芒：上下左右 -->
    <path d="M440 458 Q467.4 291.9 512 156 Q556.6 291.9 584 458 Z"/>
    <path d="M566 442 Q710.1 468.6 828 512 Q710.1 555.4 566 582 Z"/>
    <path d="M584 566 Q556.6 732.1 512 868 Q467.4 732.1 440 566 Z"/>
    <path d="M458 582 Q313.9 555.4 196 512 Q313.9 468.6 458 442 Z"/>
    <!-- 四道短芒：斜四角 -->
    <path d="M506.3 441.3 Q589.3 387.4 669 355 Q636.6 434.7 582.7 517.7 Z"/>
    <path d="M582.7 506.3 Q636.6 589.3 669 669 Q589.3 636.6 506.3 582.7 Z"/>
    <path d="M517.7 582.7 Q434.7 636.6 355 669 Q387.4 589.3 441.3 506.3 Z"/>
    <path d="M441.3 517.7 Q387.4 434.7 355 355 Q434.7 387.4 517.7 441.3 Z"/>
    <circle cx="512" cy="512" r="112"/>
  </g>

  <rect x="3" y="3" width="1018" height="1018" rx="226.5" fill="none" stroke="url(#nova-edge)" stroke-width="6"/>
</svg>
