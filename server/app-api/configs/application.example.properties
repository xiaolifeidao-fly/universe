# Copy as configs/application.properties in the runtime working directory.
server.address=:10002
sqlconn=
redis.addr=
redis.password=
redis.mode=standalone
auth.token_ttl_seconds=604800
auth.token_secret=
oss.enabled=false
oss.dirPrefix=sku
oss.endpoint=
oss.bucketName=
oss.accessKeyId=
oss.accessKeySecret=
oss.expireTime=600
oss.callbackUrl=
oss.tokenExpireTime=300
push.vapid_public_key=
push.vapid_private_key=
push.vapid_subject=mailto:ops@example.com

# Comma-separated PWA origins when client/app is deployed independently. Keep
# empty when a reverse proxy serves the PWA and app-api from the same origin.
# Wildcards are deliberately not supported because these APIs accept user tokens.
app.cors_origins=http://localhost:7894

# 业务工作台的 AI 访谈传输方式，键与 web-api 一致：手机端和控制台提的诉求落在
# 同一张表上，两个进程必须按同一套配置装配，否则同一条访谈会有两种行为。
#
# transport=http（默认）：直接调用下面那台常驻的远端 Kodes 访谈主机，一轮访谈
# 当场交互。transport=command 才把访谈交给插件 Worker 的命令队列，只在没有可达
# 访谈主机时使用。
business.kodes.transport=http
# 远端 Kodes 基地址，不要带 /v1/codex/conversation。http 传输下必填。
business.kodes.remote_url=
# 仅 command 传输用：命令归属哪个控制台用户的 Worker，业务方自己没有 Worker。
# 留空表示按项目自动选取最近心跳的在线 Worker；填了就固定到这个用户。
business.kodes.worker_user_id=
# 留空表示用远端 Codex 的默认模型；填一个不存在的标识会让访谈回合直接失败。
business.kodes.model=
# 推理强度，可选 minimal / low / medium / high / xhigh，留空按 medium 处理。
business.kodes.reasoning_effort=medium
# http 传输下是一次远端调用的超时，command 传输下是等待 Worker 领取的上限，单位秒。
business.kodes.timeout_seconds=60
