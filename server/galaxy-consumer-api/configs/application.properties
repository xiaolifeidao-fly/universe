# 启用哪些能力契约。门户目录与套餐按它列出能买到什么，Hub 按它装配真正的传输适配器；
# 两边写得不一样就会出现「门户在卖、Hub 派不出去」。只填 relay 就是一个纯中转站部署。
galaxy.adapters = relay,delivery,videofarm

# ========== 使用端控制台 ==========

# 控制台账号是 Galaxy 自己的（共享端 / 使用端两批人），和任务宇宙（web-api / app-api）
# 的账号体系无关，令牌不通用。签名密钥单独配一个，别和那几个服务的 auth.token_secret 抄成同一个。
# 没配 galaxy.auth.* 时退回 auth.token_secret / auth.token_ttl_seconds（老部署不改配置也能起来）。
galaxy.auth.token_secret = change-this-galaxy-token-secret
galaxy.auth.token_ttl_seconds = 604800

# 算力密钥明文的加密密钥。库里存的是用它加密过的明文：使用端「一键使用」、运营在管理端
# 查看并转交密钥，都要解得开。**manager-api 和 galaxy-hub-api 必须配同一个值** ——
# Hub 的 /v1 换发也是用它封的，三边不一致就会出现「有的密钥取得回、有的取不回」。
# 不配也能跑：密钥照常签发和鉴权，只是新签的都取不回明文。配上之后就别再改 ——
# 改了之前签的全部解不开（鉴权不受影响，按哈希查），只能让使用者换发。
galaxy.key_cipher_secret = change-this-key-cipher-secret

# 消费者 SDK 要填的 base_url（消费者打的是 Hub 的 /v1/*，不是这个服务）。
# 控制台的「一键使用」、取回密钥的弹窗、门户首页的接入地址，展示的都是这一条原样的字符串，
# 所以它必须穿得过公网入口。不配就从 galaxy.instance 派生，而这个服务根本没有 instance
# 语义，派生出来的是一个用户够不到的本机地址 —— 生产部署必须显式写。
galaxy.consumer_base_url = https://www.galaxy.rodeo/hub-api/v1

# 使用端桌面客户端（Orbit）的下载地址。使用端控制台的密钥页会把它原样摆出来。
# 控制台自己就是这个客户端的界面，但它同时挂在浏览器上；而把密钥一键写进本机
# Claude Code / Codex 配置的那个「使用」按钮只有桌面壳里才有 —— 浏览器里的人
# 需要一条路把客户端拿到手，就是这一条。
# 填什么由部署方定：直指某一个安装包，或者指一个列出各系统安装包的下载页（mac 是 dmg、
# Windows 是 exe、Linux 是 AppImage，一条地址盖不全三个，指一个页更省事）。
# 不配就是那一块不显示 —— 安装包托管在哪儿服务端猜不出来，猜一个只会换来一次 404。
#
# 这一条现在是**默认值**：管理端「ai-bridge 版本」页顶上那张卡片改的是数据库里的
# client.consumer_download_url，它盖过这里。换个地方放安装包不必再动这个文件、重启进程；
# 卡片上点「清除」就退回这里写的值。共享端 Nova 的下载地址只在那张卡片上，没有对应的配置项。
# galaxy.consumer_client_download_url = https://www.galaxy.rodeo/download

# 对外声明的模型清单：控制台的模型下拉、门户的模型卡片都按它渲染，
# 要和 Hub 那份（GET /v1/models 返回的）写成同一份，否则页面上能选的模型 SDK 拿不到。
# 写的顺序就是下拉里的顺序。不配走代码里的兜底清单。
# 它只是一份声明，和派单无关：能不能真派出去仍看各节点自己的允许/拒绝规则，
