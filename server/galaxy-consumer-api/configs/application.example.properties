# galaxy-api：共享算力池 Hub。
# 进程监听地址。main.go 与 start.sh 都读这一项，改端口只改这里。
server.address=:10005

sqlconn = user:password@tcp(127.0.0.1:3306)/universe?charset=utf8&parseTime=True&loc=Local

log.dir=./logs/

# 控制面。共享池没有 Redis 不能启动：座位与额度的原子性靠它。
redis.addr = 127.0.0.1:6379
redis.password =
redis.mode = standalone
galaxy.redis_namespace = galaxy
# 连接池要大于同时长轮询的节点数：领活用 BLPOP，每个在轮询的节点独占一条连接。
# 不填按 600（对应「单实例 ≥ 500 节点」这条非功能需求）。
# galaxy.redis_pool_size = 600

# 控制台账号是 Galaxy 自己的（共享端 / 使用端两批人），和任务宇宙（web-api / app-api）
# 的账号体系无关，令牌不通用。签名密钥单独配一个，别和那几个服务的 auth.token_secret 抄成同一个。
# 没配 galaxy.auth.* 时退回 auth.token_secret / auth.token_ttl_seconds（老部署不改配置也能起来）。
galaxy.auth.token_secret = change-this-galaxy-token-secret
galaxy.auth.token_ttl_seconds = 604800

# 算力密钥明文的加密密钥。库里存的是用它加密过的明文：使用端「一键使用」、运营在管理端
# 查看并转交密钥，都要解得开。**manager-api 必须配同一个值**，不然管理端取不回 galaxy-api 签发的密钥。
# 不配也能跑：密钥照常签发和鉴权，只是新签的都取不回明文。配上之后就别再改 ——
# 改了之前签的全部解不开（鉴权不受影响，按哈希查），只能让使用者换发。
galaxy.key_cipher_secret = change-this-key-cipher-secret

# 节点上行要能打到持有消费者连接的这台实例。多实例部署时填内网地址。
galaxy.instance = http://127.0.0.1:10006
# 给用户看的两个对外地址。**它们和 galaxy.instance 是两回事**：instance 是实例之间
# 互相寻址用的，这两个要穿过反代/公网入口，由控制台原样展示给用户去填。
# consumer_base_url 是消费者 SDK 的 base_url（消费者打 /v1/*）；
# provider_hub_url 是提供者 ai-bridge 的 pool.hubURL（节点打 /agent/v1/*）。
# 都留空就从 instance 派生 —— 单机开发时恰好是对的，生产部署必须显式配，
# 否则控制台会把一个用户根本够不到的内网地址显示给他照着填。
# galaxy.consumer_base_url = https://hub.example.com/v1
# galaxy.provider_hub_url = https://hub.example.com
# 启用哪些适配器。只填 relay 就是一个纯中转站部署。
galaxy.adapters = relay,delivery,videofarm
# 契约版本。与节点不一致时 hello 阶段拒连。
galaxy.contract_version = 1
# 对外声明的模型清单：消费者做「模型发现」（GET /v1/models）时拿到的就是它。
# 第三方客户端拿不到清单就不让人往下配（连接测试至少要有一个模型），所以这条路由
# 必须有东西可返；写的顺序就是客户端下拉里的顺序。不配走代码里的兜底清单。
# 它只是一份声明，和派单无关：能不能真派出去仍看各节点自己的允许/拒绝规则，
# 多写一个没人提供的模型，换来的是一次 no_capacity。
# galaxy.models = claude-opus-5,claude-sonnet-5,claude-fable-5-1,claude-haiku-4-5-20251001,claude-opus-4-8,claude-opus-4-7,claude-opus-4-6,claude-opus-4-5-20251101,gpt-5.6-terra,gpt-5.6-sol,gpt-5.6-luna

# 以下留空即用设计文档第 15 节的默认参数。
# galaxy.platform_seat_limit = 10
# galaxy.bind_idle_ttl_ms = 1800000
# galaxy.spill_wait_ms = 3000
# galaxy.max_wait_ms = 10000
# galaxy.heartbeat_timeout_ms = 45000
# 节点消失时不要让消费者干等（设计文档 6.2）。前者是「派单之后多久没人认领上行
# 就判节点掉线」，要盖住「领活 → 打上游 → 首字节」这一段，压太短会把慢请求误杀；
# 后者是首字节之前多久探一次节点心跳，探得比心跳周期还密没有额外信息。
# galaxy.attach_timeout_ms = 30000
# galaxy.node_probe_interval_ms = 10000
# galaxy.stream_idle_timeout_ms = 60000
# galaxy.body_limit_bytes = 4194304
# galaxy.key_ttl_days = 30
# galaxy.key_freeze_days = 30
# galaxy.provider_terms_version = provider-terms/v1
# galaxy.consumer_notice_version = consumer-notice/v1

# 抽检：用 Hub 自己的账号把 ≤1% 的请求重放一遍，比对结构相似度，识别伪造响应的节点。
# 不配 Hub 自有账号则抽检整体关闭 —— 拿被查者的凭据去查，结论没有意义。
# galaxy.audit.anthropic_api_key =
# galaxy.audit.openai_api_key =
# galaxy.audit.anthropic_base_url = https://api.anthropic.com/v1
# galaxy.audit.openai_base_url = https://api.openai.com/v1
# 比例上限 1%，代码里还会再封一次；每贡献每日最多抽几次由 daily_cap 决定。
# galaxy.audit.ratio = 0.01
# galaxy.audit.daily_cap = 20

# 提供者信誉每天回升多少，封顶 1。散户的信誉跟着账号、工作室的跟着设备指纹，重新配对都不清零；
# 节点故障扣 0.05、抽检判伪造扣 0.5，按默认值分别一天、十天回来。
# galaxy.reputation_recovery_per_day = 0.05

# 会话多久没有新回合就自动关闭并释放座位。
# galaxy.session_idle_hours = 24

# 提现。
#
# **口径**：提供者的积分和使用者的积分是同一件事 —— 1 积分 = ¥1，库里存「微积分」
# （1,000,000 = 1 积分，和单价、金额同一量纲）。账本、余额、下面这两个配置项
# 全都按微积分算，界面按 ÷1,000,000 显示。
#
# rate 是「多少微积分兑一块钱」，同时也是提现的最小步长（默认按整积分提现）；
# min_credits 是起提金额（默认 10,000,000 = 10 积分 = ¥10）；
# hold_days 是争议期，这段时间内刚结算的积分算「待结算」，提不出来 ——
# 争议成立要原路追回，钱已经打出去就追不回来了。
#
# 注意：2026-09-12 之前这两项按「1 积分 = ¥0.01」写，老配置里的
# payout_rate = 100 / payout_min_credits = 1000 现在含义完全不同，务必一起改过来。
# galaxy.payout_rate = 1000000
# galaxy.payout_min_credits = 10000000
# galaxy.payout_hold_days = 7

# 事件日志在内存里保留多少条；更早的靠数据库回放。
# galaxy.journal_buffer = 512

# 门户面（/api/galaxy/portal/*，**未登录**就能打）。
#
# availability 是**部署方的承诺**，不是算出来的指标。不配就是空串，门户首页
# 那排数字少显示一格 —— 默认给个 99.9% 等于替你许了一个你没许的诺。
# galaxy.portal.availability = 99.9%
#
# 只读接口的缓存时长。公开地址直通数据库就是一条没有闸门的压测通道。
# galaxy.portal.cache_ttl_ms = 30000
#
# 整套部署每小时最多收多少条「联系我们」。它是「有人换着 IP 刷」的兜底闸；
# 按 IP 的那道（一小时 5 条）在库里，跨实例一致。
# galaxy.portal.leads_per_hour = 60

# ai-bridge 的版本分发。安装包由运营在管理端上传（那边要配 oss.* 与发布公钥），
# 这个进程只负责把清单、校验值、安装脚本和下载跳转发出去。
#
# download_base_url 是安装包的公开访问前缀（桶是公开读或者前面挂了 CDN 时配）：
# 配了就直接拼地址，不配走 OSS 签名地址。两种都行 —— 签名地址会过期，而
# /agent/v1/bridge/download/<平台> 那一跳是稳定的，文档和脚本里写的是它。
# galaxy.bridge_release.download_base_url = https://cdn.example.com

# 共享端的邀请返现。
#
# rate：好友贡献算力赚到的积分，平台**额外**奖励邀请人这么多（0.1 = 10%）。
# 好友自己的收益一分不少 —— 这笔钱是平台出的。0 或不配表示这个活动没开。
# 只返一层，而且同一台设备（设备指纹）上跑出来的收益不返（防自己邀请自己的小号）。
# galaxy.referral.rate = 0.1
# days：返现期限（天）。0 表示长期有效。
# galaxy.referral.days = 0
# register_url：邀请链接指向的注册页，也就是 Nova 网页版的 /register。
# 不配就没有链接可分享，邀请页只显示邀请码 —— 给一个打不开的链接更糟。
# galaxy.referral.register_url = https://nova.example.com/register

# 产物走 OSS presigned 直传，Hub 不经手字节。不配则产物接口不可用。
oss.enabled = false
oss.dirPrefix = galaxy
oss.endpoint =
oss.bucketName =
oss.accessKeyId =
oss.accessKeySecret =
oss.expireTime = 600
oss.tokenExpireTime = 300

# 支付渠道回调。一个渠道都不配就不注册回调路由 —— 一个不验签的支付回调等于把
# 「发额度」挂在公网上。回调地址 POST /galaxy/payments/{channel}/callback，
# {channel} 就是下面的渠道码，每个渠道用自己的密钥验签（互相验不过）。
#
# 写法一：单渠道（老写法，保留）。
# galaxy.payment.channel = default
# galaxy.payment.hmac_secret =
#
# 写法二：多渠道。列出渠道码，各自的密钥挂在 galaxy.payment.<code>.* 下。
# 没给密钥的渠道会被跳过并打日志，不会带着空密钥上线。
# galaxy.payment.channels = wechat,alipay,stripe
# galaxy.payment.wechat.title = 微信支付
# galaxy.payment.wechat.hmac_secret =
# galaxy.payment.alipay.title = 支付宝
# galaxy.payment.alipay.hmac_secret =
# galaxy.payment.stripe.title = Stripe
# galaxy.payment.stripe.hmac_secret =
# galaxy.payment.stripe.signature_header = Stripe-Signature
#
# 签名头、时间戳头与容差：先看渠道自己的，没写就落到这一层。
# 签名算 HMAC-SHA256(secret, timestamp + "." + body)。
# galaxy.payment.signature_header = X-Signature
# galaxy.payment.timestamp_header = X-Timestamp
# 时间戳容差：签名一旦泄露，这个值决定了它还能被重放多久。
# galaxy.payment.tolerance_seconds = 300
#
# 沙箱渠道：**没有收银台，本人在控制台点一下就算到账**。内测期让购买链路跑通用的。
# 它不接受任何外部回调（打 /galaxy/payments/<code>/callback 会被拒），
# 支付走 POST /api/galaxy/consumer/orders/pay/sandbox，认登录用户且只能付自己的订单。
# 生产环境必须留空 —— 配上就等于给每个注册用户开了免费领额度的口子。
# galaxy.payment.sandbox_channels = wechat_sandbox,alipay_sandbox,card_sandbox
# galaxy.payment.wechat_sandbox.title = 微信支付（沙箱）
# galaxy.payment.alipay_sandbox.title = 支付宝（沙箱）
# galaxy.payment.card_sandbox.title = 银行卡（沙箱）

# 三个服务必须使用相同的 MySQL、Redis namespace 和 Galaxy 密钥配置。
galaxy.consumer_base_url = http://127.0.0.1:10006/v1
galaxy.provider_hub_url = http://127.0.0.1:10006
