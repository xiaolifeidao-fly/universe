# Copy as configs/application.properties in the runtime working directory.
server.address=:10003

# 和 web-api / app-api 指向同一个 MySQL 库。注意：管理端的**登录账号**是独立的
# 一套（zt_manager_*），和 identity 的业务用户没有任何数据关联；共用一个库只是
# 因为它们本来就在同一个实例上。
sqlconn=

log.dir=./logs/

# 管理端的登录令牌存在 Redis 里，所以 Redis 是启动硬依赖 —— 连不上进程直接退出。
# 用外部存储而不是无状态签名令牌，图的是即时吊销：管理端会动真钱（封禁节点、
# 裁决争议、发算力密钥），撤权、禁用、改密必须当场生效，不能等令牌自然过期。
redis.addr=127.0.0.1:6379
redis.password=
redis.mode=standalone
# 键前缀。同一个 Redis 上跑多套环境时用它隔开，不填按 manager。
# manager.redis_namespace=manager

# 会话有效期（秒），每次请求滑动续期。
auth.token_ttl_seconds=604800

# auth.token_secret 只给 identity 用（/api/users 那几个页面读写的是**业务用户**，
# 走的还是 service/identity）。管理端自己的登录不用它 —— 令牌是 Redis 里的随机串，
# 不携带任何信息。
auth.token_secret=

# 首次在一个空库上跑 `go run ./cmd/managerinit` 时用到：建表、登记资源、
# 写入三个默认角色，并创建这个默认管理员（首次登录必须改密码）。
# 库里已经有同名账号的话这三项不会有任何效果，不会把线上密码重置回来。
auth.default_username=admin
auth.default_display_name=Administrator
auth.default_password=

# 共享算力池运营页取回算力密钥明文用的加密密钥，必须和 galaxy-api 的 galaxy.key_cipher_secret 一模一样。
# galaxy.key_cipher_secret =
# 运营转交密钥时一起给对方的接入地址（SDK 的 base_url，带 /v1），和 galaxy-api 的
# galaxy.consumer_base_url 填同一个。不配的话管理端只给密钥，地址要自己补。
# galaxy.consumer_base_url = https://hub.example.com/v1

# ========== 对象存储：两个发版页共用同一份 oss.* ==========
#
# 管理端要装对象存储有两个理由，都只在运营这一侧成立，而且用法正好相反：
#
#   ai-bridge 安装包        服务端**要经手字节**（包才三兆）—— sha256 与发布签名的
#   （「ai-bridge 版本」页） 校验只有经手的一方做得了。这是「不搬字节」的唯一例外。
#   桌面客户端 Nova / Orbit  包一百多兆，字节**不经服务端**：管理端浏览器拿签名地址
#   （「桌面客户端版本」页） 直传，服务端只签地址、写那份几百字节的 latest-*.yml 清单、
#                           确认包到了没有。这一侧没有发布签名 —— 校验值在清单里，
#                           客户端走 electron-updater 自己比对。
#
# 共享池的产物（delivery / videofarm）仍然走 Hub 与使用端的 presigned 直传，不经过这里。
# 不配就只是这两页发不了版，接口会明说，其它运营页面完全不受影响。
#
# 桶要和 galaxy-hub-api 填**同一个**：ai-bridge 的包由这里写入、由 Hub 签下载地址，
# 入库的是带 dirPrefix 的完整对象键（Hub 签名时不再补前缀，两边的 dirPrefix 不必相同）。
#
# 这个进程用得上的只有下面这六个键。oss.expireTime / tokenExpireTime / callbackUrl
# 填了也不改变行为 —— 直传地址的有效期在代码里（两小时），而 ai-bridge 那条路压根
# 不签地址；但它们**写成非法值时整段 oss.* 会加载失败**，两页一起发不了版，所以
# 与其照抄别的服务，不如不写。
# oss.enabled = false
# endpoint 是**这个进程自己**读写走的路（写清单、写 ai-bridge 包）。同区 VPC 才填
# -internal，不在的话两样都会超时。
# oss.endpoint =
# publicHost 是**交到别人手里**的地址走的路：安装包由运营浏览器拿签名地址直传，
# 签成内网域名他那台机器连不上，发版第一步就断，而且只表现为一个超时。
# 不配就回落到 endpoint。挂了 CDN 或自定义域名就填那个。
# oss.publicHost =
# oss.bucketName =
# oss.accessKeyId =
# oss.accessKeySecret =
# 落点是 <dirPrefix>/ai-bridge/、<dirPrefix>/nova/、<dirPrefix>/orbit/。改 dirPrefix
# 等于改两个桌面端的更新地址：客户端**直接去桶上取清单**（不打这里任何接口），
# 而它拿到的地址是两个 galaxy API 从各自的 oss.publicHost + oss.dirPrefix 推出来的 ——
# 那两份必须和这里一致，否则清单写到 A、客户端去 B 取，表现是安静地不更新。
# oss.dirPrefix = galaxy
#
# 桶那一侧还有两条，配不对时症状分别是「谁都收不到更新」和「运营传不上去」：
#   - <dirPrefix>/nova/ 与 <dirPrefix>/orbit/ 要**公开读**（或前面挂 CDN）；只放开这两个
#     前缀，别整个 dirPrefix 放开 —— 隔壁 ai-bridge/ 的包走的是 Hub 当场签发的地址。
#   - 桶要允许**管理端那个域名跨域 PUT**，安装包是浏览器直传的，不经过 manager-api。
#
# ai-bridge 的发布公钥（base64，逗号分隔，可以配多把，换钥匙时新旧并存）。不配则
# 安装包上传一律不收。公钥必须和编进 ai-bridge 的 release-keys.txt 一致 —— 验不过的包
# 这里就得拦下，传上去了节点也会在升级的最后一步拒装，而那时候运营已经以为发布完成了。
# 私钥离线保管，签名用 client/galaxy/nova/electron/ai-bridge-native/scripts/release-sign.cjs。
# galaxy.bridge_release.public_keys =

# 独立部署管理端前端（client/manager）时需要的跨域白名单，逗号分隔。
# 同源反代部署留空即可，不会发出 CORS 头。
manager.cors_origins=http://localhost:7895
