# 启用哪些适配器。Hub 按它装配真正的传输通道，两个控制台按同一份决定页面上能选什么；
# 写得不一样就会出现「控制台能选、这里派不出去」。只填 relay 就是一个纯中转站部署。
galaxy.adapters = relay,delivery,videofarm

# ========== 实例地址 ==========

# **这一条是多实例部署里唯一必须逐个实例配不同值的键。**
#
# 消费者的那条连接活在某个进程的内存里（Exchange，响应字节不进 Redis）。派单时把这个
# 地址写进 req:{rid}.instance，节点领到活时拿到的 streamURL 就是
# <instance>/agent/v1/units/<unitId>/stream —— 节点必须把上行打回**同一个进程**，
# 打到别的实例上是 ErrNotAttached，消费者那边干等到 attach_timeout 才报节点掉线。
#
# 所以：
#   * 填一个只指向这一台的地址；
#   * **绝对不能填负载均衡/VIP 的入口**。那个地址会把上行轮询到随机实例，
#     故障是概率性的、日志两边都正常，最难查的一类。ip_hash 之类的粘滞也救不了 ——
#     要钉住的是「哪条请求」，不是「哪个客户端」：消费者和节点是两个不同的客户端。
#   * 它要能**从节点所在的机器访问**。节点跑在用户自己的电脑上，所以除非节点也在你内网，
#     否则这里不能填内网地址。
#   * 其余接口（/v1/*、节点的 register / hello / heartbeat / next）落到哪个实例都行，
#     那些照常走统一入口。
#
# 多实例推荐写法：统一域名 + 一段实例标识，让前面的 nginx 按那一段精确转发
# （示例见 doc/deployment/nginx/www.galaxy.rodeo.conf 的「实例定向路由」段）。
# {hostname} 会在启动时换成本机主机名的短名，于是这一行三台照抄即可：
#
#   galaxy.instance = https://www.example.com/instance/{hostname}
#
# 也可以用环境变量 GALAXY_INSTANCE 覆盖这一项（优先级更高），容器/编排直接注入。
galaxy.instance = https://www.galaxy.rodeo/hub-api

# 提供者的 ai-bridge 要填的 pool.hubURL。注册结果、心跳回包和安装脚本都把它发给节点，
# galaxy-api 的接入页也展示同一个值，两份必须一致。
# 它和 galaxy.instance 是两回事：instance 指的是**这一台**，这个是所有人共用的公网入口。
# 不配就从 instance 派生 —— 单机开发恰好是对的，多实例部署会把某一台的专属地址
# 当成通用入口发出去。生产必须显式写。
galaxy.provider_hub_url = https://www.galaxy.rodeo/hub-api

# ========== 密钥与清单 ==========

# 算力密钥明文的加密密钥。Hub 的 /v1/keys/:id/renew 换发时用它封存明文，
# /v1/keys/me 靠它判断这把密钥能不能取回。**galaxy-consumer-api 与 manager-api 必须同值** ——
# 不一致会出现「控制台签的取得回、SDK 换发的取不回」。
# 不配也能跑：密钥照常签发和鉴权，只是新签的都取不回明文。配上之后就别再改 ——
# 改了之前签的全部解不开（鉴权不受影响，按哈希查），只能让使用者换发。
galaxy.key_cipher_secret = change-this-key-cipher-secret

# 对外声明的模型清单：消费者做「模型发现」（GET /v1/models）时拿到的就是它。
# 第三方客户端拿不到清单就不让人往下配（连接测试至少要有一个模型），所以这条路由
# 必须有东西可返；写的顺序就是客户端下拉里的顺序。不配走代码里的兜底清单。
# 使用端控制台按同一份渲染模型下拉，两边要一致。
# 它只是一份声明，和派单无关：能不能真派出去仍看各节点自己的允许/拒绝规则，
# 多写一个没人提供的模型，换来的是一次 no_capacity。
# galaxy.models = claude-opus-5,claude-sonnet-5,claude-fable-5-1,claude-haiku-4-5-20251001,claude-opus-4-8,claude-opus-4-7,claude-opus-4-6,claude-opus-4-5-20251101,gpt-5.6-terra,gpt-5.6-sol,gpt-5.6-luna

# 契约版本。与节点不一致时 hello 阶段拒连。
galaxy.contract_version = 1

# 连接池要大于同时长轮询的节点数：领活用 BLPOP，每个在轮询的节点独占一条连接。
# 不填按 600（对应「单实例 ≥ 500 节点」这条非功能需求）。只有这个服务长轮询。
# galaxy.redis_pool_size = 600

# ========== 派单与超时 ==========
#
# 以下留空即用设计文档第 15 节的默认参数。
#
# galaxy.spill_wait_ms = 3000
# galaxy.max_wait_ms = 10000
# 绑定空闲多久释放；多久没心跳算掉线。galaxy-api 用同样两个值算控制台上的座位与在线灯，
# 两边不一致会出现「控制台说在线、这里说没人」。
# galaxy.bind_idle_ttl_ms = 1800000
# galaxy.heartbeat_timeout_ms = 45000
# 节点消失时不要让消费者干等（设计文档 6.2）。前者是「派单之后多久没人认领上行
# 就判节点掉线」，要盖住「领活 → 打上游 → 首字节」这一段，压太短会把慢请求误杀；
# 后者是首字节之前多久探一次节点心跳，探得比心跳周期还密没有额外信息。
# galaxy.attach_timeout_ms = 30000
# galaxy.node_probe_interval_ms = 10000
# galaxy.stream_idle_timeout_ms = 60000
# galaxy.body_limit_bytes = 4194304
# 会话多久没有新回合就自动关闭并释放座位。
# galaxy.session_idle_hours = 24
# 事件日志在内存里保留多少条；更早的靠数据库回放。
# galaxy.journal_buffer = 512

# ========== 密钥有效期与同意版本 ==========
#
# /v1 上的换发按这两个值算，和使用端控制台签发时用的是同一套参数，必须一致。
# galaxy.key_ttl_days = 30
# galaxy.key_freeze_days = 30
# 同意记录的当前版本，升版后旧同意失效：提供者下次 hello 被要求重新同意条款，
# 使用者下次签发新密钥被要求重新确认告知。分别和 galaxy-api、galaxy-consumer-api 保持一致。
# galaxy.provider_terms_version = provider-terms/v1
# galaxy.consumer_notice_version = consumer-notice/v1

# ========== 信誉与返现 ==========

# 提供者信誉每天回升多少，封顶 1。散户的信誉跟着账号、工作室的跟着设备指纹，重新配对都不清零；
# 节点故障扣 0.05、抽检判伪造扣 0.5，按默认值分别一天、十天回来。
# 扣分与回血发生在这里，galaxy-api 只是按同一个值展示，两边要一致。
# galaxy.reputation_recovery_per_day = 0.05

# 共享端邀请返现的**发放**在这里：每笔结算按比例额外给邀请人记一笔（平台出钱，
# 好友自己的收益一分不少），只返一层，同一台设备（设备指纹）上跑出来的收益不返。
# galaxy-api 按同样的 rate / days 展示活动规则，两边不一致等于页面写着 10%、账上一分没有。
# 邀请链接地址（referral.register_url）只有控制台用得上，这里不需要。
# galaxy.referral.rate = 0.1
# galaxy.referral.days = 0

# ========== 抽检 ==========

# 用 Hub 自己的账号把 ≤1% 的请求重放一遍，比对结构相似度，识别伪造响应的节点。
# 不配 Hub 自有账号则抽检整体关闭 —— 拿被查者的凭据去查，结论没有意义。
# galaxy.audit.anthropic_api_key =
# galaxy.audit.openai_api_key =
# galaxy.audit.anthropic_base_url = https://api.anthropic.com/v1
# galaxy.audit.openai_base_url = https://api.openai.com/v1
# galaxy.audit.anthropic_version = 2023-06-01
# 比例上限 1%，代码里还会再封一次；每贡献每日最多抽几次由 daily_cap 决定。
# galaxy.audit.ratio = 0.01
# galaxy.audit.daily_cap = 20

