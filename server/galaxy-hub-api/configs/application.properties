# galaxy-hub-api：共享算力池 Hub。
#
# 消费者 SDK（/v1/*）、节点协议（/agent/v1/* 的注册、配对、心跳、领活、回传、升级）、
# bridge 安装包下载、派单器、抽检重放、后台巡检都在这个进程。它是三个服务里唯一
# 跑后台任务、唯一持有消费者连接的那个 —— 派单参数只有配在这里才生效。
# 两个控制台（galaxy-api / galaxy-consumer-api）不派单，那边不需要这些键。
#
# 进程监听地址。main.go 与 start.sh 都读这一项，改端口只改这里（GALAXY_HUB_API_ADDR 优先于它）。
server.address=:10006

# ---------- 优雅退出 ----------
#
# 收到 SIGTERM 之后的顺序是定死的：翻 readyz→503 并停止领新活 → 等 drain_delay
# 让上游把这台摘出轮转 → 关监听、等在途请求跑完（上限 timeout）→ 退出。
#
# drain_delay 是给「摘流量不是瞬时的」留的余量：nginx reload、K8s 更新 Endpoints
# 都要一会儿。这一段不等就关监听，那几百毫秒里进来的请求吃的是连接拒绝 ——
# 明明是计划内的重启，用户看到的却是故障。
# galaxy.shutdown.drain_delay_ms = 5000
#
# timeout 是等在途请求跑完的上限，必须盖住最长的那类**不可中断**连接 ——
# relay 的 maxRunSec（默认 600 秒）。那条连接上已经有字节流给消费者了，
# 掐掉就是一次收不回的失败请求。
# 可中断的那些不吃这个时限，退出一开始就各自收线：节点的长轮询当场回 204
# （它换一台再来），session / job 的 SSE 订阅主动发一个 end（事件先落库后广播，
# 客户端按 seq 重连能补齐）。
# 绝大多数请求几秒就完，这个数只是上限，平时的退出快得多。
# galaxy.shutdown.timeout_ms = 630000
#
# 部署侧要跟着配：systemd 的 TimeoutStopSec、K8s 的 terminationGracePeriodSeconds
# 都必须大于这两项之和，否则进程会在收尾到一半时被补一刀 SIGKILL。

