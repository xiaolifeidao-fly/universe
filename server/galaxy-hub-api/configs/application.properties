# ai-bridge 的版本分发。安装包由运营在管理端上传（那边要配 oss.* 与发布公钥），
# 这个进程只负责把清单、校验值、安装脚本和下载跳转发出去。
#
# download_base_url 是安装包的公开访问前缀（桶是公开读或者前面挂了 CDN 时配）：
# 配了就直接拼地址，不配走 OSS 签名地址。两种都行 —— 签名地址会过期，而
# /agent/v1/bridge/download/<平台> 那一跳是稳定的，文档和脚本里写的是它。
# galaxy.bridge_release.download_base_url = https://cdn.example.com

# ========== 故意不在这里的配置 ==========
#
# 下面这些键这个进程一个都不读，抄进来只会让人以为改了有用：
#
#   galaxy.auth.*                   Hub 不认账号令牌，只认算力密钥和节点令牌
#   galaxy.consumer_base_url        控制台展示给用户的 SDK 地址，见 galaxy-consumer-api
#   galaxy.payment.*                /v1/orders 只建待支付订单；验签与到账在使用端服务
#   galaxy.portal.*                 门户在使用端服务
#   galaxy.payout_* / referral.register_url / platform_seat_limit   提供端控制台的，见 galaxy-api
