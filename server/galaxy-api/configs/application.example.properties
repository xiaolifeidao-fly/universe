# galaxy-api：Nova 提供端控制台与提供端账号（/api/galaxy/provider/*）。
#
# 它只服务「人」这一侧：节点列表、贡献开关、配对码、提供者密钥、收益与提现、邀请返现。
# 派单、节点协议（/agent/v1/*）、SDK（/v1/*）全在 galaxy-hub-api；算力密钥的签发、
# 订单支付、门户在 galaxy-consumer-api。所以那两块的配置项这里一概不需要，
# 文件末尾列了「故意不在这里」的清单，别再从别的服务抄回来。
#
# 进程监听地址。main.go 与 start.sh 都读这一项，改端口只改这里（GALAXY_API_ADDR 优先于它）。
server.address=:10004

# ---------- 优雅退出 ----------
#
# 收到 SIGTERM 之后的顺序是定死的：翻 readyz→503 并停止领新活 → 等 drain_delay
# 让上游把这台摘出轮转 → 关监听、等在途请求跑完（上限 timeout）→ 退出。
#
# drain_delay 是给「摘流量不是瞬时的」留的余量：nginx reload、K8s 更新 Endpoints
# 都要一会儿。这一段不等就关监听，那几百毫秒里进来的请求吃的是连接拒绝 ——
# 明明是计划内的重启，用户看到的却是故障。
# galaxy.shutdown.drain_delay_ms = 5000
#
# timeout 是等在途请求跑完的上限。控制台没有长连接，请求都是秒级的，30 秒够了。
# galaxy.shutdown.timeout_ms = 30000
#
# 部署侧要跟着配：systemd 的 TimeoutStopSec、K8s 的 terminationGracePeriodSeconds
# 都必须大于这两项之和，否则进程会在收尾到一半时被补一刀 SIGKILL。

# ========== 公共段：三个服务必须填同一份 ==========

sqlconn = user:password@tcp(127.0.0.1:3306)/universe?charset=utf8&parseTime=True&loc=Local

# 控制面。没有 Redis 不能启动 —— 座位与额度的原子性靠它，控制台读到的在线状态也来自这里。
redis.addr = 127.0.0.1:6379
redis.password =
redis.mode = standalone
galaxy.redis_namespace = galaxy

# 启用哪些能力契约。这个服务按它决定提供者能贡献什么，Hub 按它装配真正的传输适配器；
# 两边写得不一样就会出现「控制台能选、Hub 派不出去」。只填 relay 就是一个纯中转站部署。
galaxy.adapters = relay,delivery,videofarm

# ========== 提供端控制台 ==========

# 控制台账号是 Galaxy 自己的（共享端 / 使用端两批人），和任务宇宙（web-api / app-api）
# 的账号体系无关，令牌不通用。签名密钥单独配一个，别和那几个服务的 auth.token_secret 抄成同一个。
# 没配 galaxy.auth.* 时退回 auth.token_secret / auth.token_ttl_seconds（老部署不改配置也能起来）。
galaxy.auth.token_secret = change-this-galaxy-token-secret
galaxy.auth.token_ttl_seconds = 604800

# 提供者的 ai-bridge 要填的 pool.hubURL。**节点打的是 Hub，不是这个服务** ——
# 这里只负责把地址和安装命令原样展示给用户去照着填，所以它必须穿得过公网入口。
# 不配就从 galaxy.instance 派生，而这个服务根本没有 instance 语义，派生出来的是
# 一个用户够不到的本机地址。生产部署必须显式写，和 Hub 那份保持一致。
# 线上是 https://www.galaxy.rodeo/hub-api —— 那段前缀由 nginx 剥掉再转给本服务注册的
# /v1/... 与 /agent/v1/...，服务自己不认前缀。所以这个值必须和 nginx 上 Hub 那条 location
# 对齐，只改一边就是 404（详见 doc/deployment/galaxy-services.md「三个『对外地址』」一节）。
galaxy.provider_hub_url = http://127.0.0.1:10006

# 以下留空即用设计文档第 15 节的默认参数。
#
# 单个提供者最多开多少座位（保存贡献上限时校验）。
# galaxy.platform_seat_limit = 10
# 绑定空闲多久释放。停用贡献时按它清座位 —— 和 Hub 填同一个值，否则两边算出的可用座位对不上。
# galaxy.bind_idle_ttl_ms = 1800000
# 多久没心跳算掉线。节点列表的「在线」灯按它判定，和 Hub 不一致会出现控制台说在线、派单说没人。
# galaxy.heartbeat_timeout_ms = 45000
# 提供者条款版本。升版后旧同意失效，节点下次 hello 被要求重新同意 —— 和 Hub 填同一个值。
# galaxy.provider_terms_version = provider-terms/v1
# 机器信誉每天回升多少，封顶 1。这里只用于展示，真正的扣分与回血在 Hub，两边要一致。
# 节点故障扣 0.05、抽检判伪造扣 0.5，按默认值分别一天、十天回来。
# galaxy.reputation_recovery_per_day = 0.05

# 提现。
#
# **口径**：提供者的积分和使用者的积分是同一件事 —— 1 积分 = ¥1，库里存「微积分」
# （1,000,000 = 1 积分，和单价、金额同一量纲）。账本、余额、下面这两个配置项
# 全都按微积分算，界面按 ÷1,000,000 显示。
#
# rate 是「多少微积分兑一块钱」，同时也是提现的最小步长（默认按整积分提现）；
# min_credits 是起提金额（默认 10,000,000 = 10 积分 = ¥10）；
# hold_days 是争议期，这段时间内刚结算的积分算「待结算」，提不出来 ——
# 争议成立要原路追回，钱已经打出去就追不回来了。
#
# 注意：2026-09-12 之前这两项按「1 积分 = ¥0.01」写，老配置里的
# payout_rate = 100 / payout_min_credits = 1000 现在含义完全不同，务必一起改过来。
# galaxy.payout_rate = 1000000
# galaxy.payout_min_credits = 10000000
# galaxy.payout_hold_days = 7

# 共享端的邀请返现（和使用端那套「买套餐返现」是两套码、两张表，互不通用）。
#
# rate：好友贡献算力赚到的积分，平台**额外**奖励邀请人这么多（0.1 = 10%）。
# 好友自己的收益一分不少 —— 这笔钱是平台出的。0 或不配表示这个活动没开。
# 只返一层，而且同一台设备（设备指纹）上跑出来的收益不返（防自己邀请自己的小号）。
# 真正发放返现的是 Hub（结算那一刻），这里只是展示和统计：rate 与 days 两边必须一致，
# 只改这一份的结果是页面写着 10%、账上一分没有。
# galaxy.referral.rate = 0.1
# days：返现期限（天）。0 表示长期有效。
# galaxy.referral.days = 0
# register_url：邀请链接指向的注册页，也就是 Nova 网页版的 /register。只有这里用得上。
# 不配就没有链接可分享，邀请页只显示邀请码 —— 给一个打不开的链接更糟。
# galaxy.referral.register_url = https://nova.example.com/register

# ========== 故意不在这里的配置 ==========
#
# 下面这些键这个进程一个都不读，抄进来只会让人以为改了有用：
#
#   galaxy.instance                 只有 Hub 有实例语义（派单时写进 streamURL）
#   galaxy.consumer_base_url        使用端控制台和门户展示，见 galaxy-consumer-api
#   galaxy.key_cipher_secret        加密的是算力密钥明文，提供者密钥不走密文存储
#   galaxy.models                   模型清单给 SDK 和门户看，见 Hub / 使用端
#   galaxy.contract_version         节点 hello 时校验，只有 Hub 收 hello
#   galaxy.payment.* / oss.*        支付回调在使用端；产物签名在 Hub 和使用端
#   galaxy.audit.* / bridge_release 抽检与安装包分发都在 Hub
#   派单参数（spill_wait / max_wait / attach_timeout / node_probe / stream_idle /
#   body_limit / journal_buffer / session_idle_hours / key_ttl / key_freeze）
