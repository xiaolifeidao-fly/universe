# Copy as configs/application.properties in the runtime working directory.
# 真配置不进版本库：值留空的这些键是密钥或环境地址，各自本地填。
# 进程监听地址。main.go 和 start.sh 都读这一项，改端口只改这里。
# （server.port 是旧配置，当前没有任何代码在读，保留只为兼容外部脚本）
server.address=:8691
request.path=/api


sqlconn =

log.dir=./logs/

# redis.addr =
# redis.password =
# redis.mode =

redis.addr =
redis.password =
redis.mode = cluster

auth.default_username = admin
auth.default_display_name = Administrator
auth.default_password =
auth.token_ttl_seconds = 604800
# Must be replaced per environment before production deployment.
auth.token_secret =
auth.service_token =



# 业务访谈直连下面那台常驻访谈主机。
# 只有在没有可达访谈主机时才改成 command，把访谈交给插件 Worker 的命令队列。
business.kodes.transport=http
business.kodes.worker_user_id =
business.kodes.remote_url =
business.kodes.token =
business.kodes.model=gpt-5.6-terra
business.kodes.reasoning_effort=medium
business.kodes.timeout_seconds=60

oss.enabled = true

oss.dirPrefix = sku

oss.endpoint =

oss.bucketName =

oss.accessKeyId =

oss.accessKeySecret =

oss.expireTime = 600

oss.callbackUrl =

oss.tokenExpireTime = 300
