# 业务工作台的 AI 访谈传输方式。
#
# transport=http（默认）：直接调用下面那台常驻的远端 Kodes
#   POST /v1/codex/conversation 创建或续聊
#   GET  /v1/codex/conversation 读取会话回合
# 业务访谈走这条路：那台主机已经部署好，一轮访谈当场就能交互。
# transport=command：访谈改以 business.conversation 命令进入交付命令队列，
# 由本机插件的 Worker 长轮询领取、执行并回传。只有在没有可达访谈主机、
# 又必须让访谈跑在插件机器上时才用；那样一轮访谈要等 Worker 上线领取。
business.kodes.transport=http
# command 传输下命令归属哪个控制台用户的 Worker。命令表按用户隔离，
# 业务方自己没有 Worker，所以要借用正在服务该项目的交付用户身份。
# 留空表示按项目自动选取最近心跳的在线 Worker；填了就固定到这个用户。
business.kodes.worker_user_id=
# timeout_seconds 在 http 传输下是一次远端调用的超时，
# 在 command 传输下是等待 Worker 领取并回传会话标识的上限。

# 业务工作台专用的远端 Kodes 服务（默认的 http 传输就打到这里）。
# 协议与交付任务面板的本地 Bridge 完全一致：
#   POST /v1/codex/conversation 创建或续聊
#   GET  /v1/codex/conversation 读取会话回合
# web-api 只把请求发到这里，绝不会访问 127.0.0.1、本地插件或用户本机工作目录。
#
# remote_url 填远端 Kodes 的基地址，不要带 /v1/codex/conversation。
# 工作目录由业务方用户名和项目名称动态生成：
# {用户名}/业务空间/{项目名称}。远端插件会在自己的受控根目录中创建它。
# 远端业务访谈不需要额外 token。Docker 部署时使用
# WEB_API_BUSINESS_KODES_REMOTE_URL、WEB_API_BUSINESS_KODES_MODEL、
# WEB_API_BUSINESS_KODES_TIMEOUT_SECONDS 注入。
business.kodes.remote_url=http://8.216.60.153:8765
# model 必须是远端 Codex 认得的模型标识（gpt-5.6-sol / gpt-5.6-terra / gpt-5.6-luna）。
# 留空表示用远端 Codex 的默认模型；填一个不存在的标识会让访谈回合直接失败。
business.kodes.model=
# reasoning_effort 是模型推理强度，可选 minimal / low / medium / high / xhigh。
# 留空按 medium 处理。
business.kodes.reasoning_effort=medium
business.kodes.timeout_seconds=60
