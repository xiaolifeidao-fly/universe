# 业务工作台专用的远端 Kodes 服务。
# 协议与交付任务面板的本地 Bridge 完全一致：
#   POST /v1/codex/conversation 创建或续聊
#   GET  /v1/codex/conversation 读取会话回合
# web-api 只把请求发到这里，绝不会访问 127.0.0.1、本地插件或用户本机工作目录。
#
# remote_url 填远端 Kodes 的基地址，不要带 /v1/codex/conversation。
# workspace 是远端 Kodes 识别工作区的标识（不是本机文件路径），按远端部署约定配置。
# token 会以与本地 Bridge 相同的 token 请求头发送；不要提交真实凭证。
business.kodes.remote_url=https://your-kodes.example
business.kodes.token=
business.kodes.workspace=business-intake
business.kodes.model=business-intake
business.kodes.reasoning_effort=
business.kodes.timeout_seconds=60
