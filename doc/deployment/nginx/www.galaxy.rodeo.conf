# www.galaxy.rodeo —— Galaxy 单域名入口
#
# 路径分流（本机端口见 doc/deployment/galaxy-services.md 与 client/galaxy/README.md）：
#   /            → Portal 门户站            127.0.0.1:17900
#   /nova        → Nova 共享端控制台        127.0.0.1:17898   ※ 需 basePath=/nova
#   /nova/api/   → galaxy-api               127.0.0.1:10004
#   /orbit       → Orbit 使用端控制台       127.0.0.1:17899   ※ 需 basePath=/orbit
#   /orbit/api/  → galaxy-consumer-api      127.0.0.1:10005
#   /hub-api/    → galaxy-hub-api           127.0.0.1:10006（剥掉 /hub-api 前缀）
#   /instance/<名>/ → 指定的那一台 Hub        见下方「实例定向路由」，单实例时表里只有一行
#
# 两个控制台的 /*/api/ 直接打 Go 服务，不再经 Next 自带的 pages/api/[...all] 代理：
# 那个代理在 basePath 下会把 /nova/api/... 原样转给 Go 而不是剥成 /api/...，
# 而且多一跳只会让流式响应更容易被攒住。
#
# 安装：放到 /etc/nginx/conf.d/www.galaxy.rodeo.conf
#      nginx -t && systemctl reload nginx

upstream galaxy_portal   { server 127.0.0.1:17900; keepalive 32; }
upstream galaxy_nova     { server 127.0.0.1:17898; keepalive 32; }
upstream galaxy_orbit    { server 127.0.0.1:17899; keepalive 32; }
upstream galaxy_api      { server 127.0.0.1:10004; keepalive 32; }
upstream galaxy_consumer { server 127.0.0.1:10005; keepalive 32; }
upstream galaxy_hub      { server 127.0.0.1:10006; keepalive 32; }

# ---------- 实例定向路由 ----------
#
# Hub 多实例时，节点的上行（stream）必须回到**持有消费者连接的那一个进程** ——
# 消费者的连接活在那台的内存里（响应字节不进 Redis），落到别的实例就是 ErrNotAttached，
# 消费者干等到 attach_timeout。所以这一跳不能轮询，ip_hash 之类的粘滞也救不了：
# 要钉住的是「哪条请求」，而消费者和节点是两个不同的客户端、两个不同的 IP。
#
# 路由信息由 Hub 自己写进 URL —— 它把 galaxy.instance 拼进派给节点的 streamURL，
# nginx 只需按 /instance/<名>/ 这一段把请求送到对应那台。
# 加一台机器 = 这张表加一行 + 那台的 galaxy.instance 里换个名字。
#
# 那边配成 https://www.galaxy.rodeo/instance/{hostname} 的话（{hostname} 由 Hub 启动时
# 替换成本机主机名短名），三台的配置文件可以完全一样；也可以用环境变量 GALAXY_INSTANCE 注入。
#
# 匹配 $uri 而不是在 location 里 set 一个变量再喂给 map：map 是惰性求值的，
# 先 set 后引用在某些顺序下会拿到缓存的旧值，直接匹配 $uri 没有这个坑。
#
# 表里填 IP:端口。填主机名的话，因为 proxy_pass 带了变量，nginx 会在运行时解析，
# 那就必须在 server 里加一条 resolver，否则启动就报 "no resolver defined"。
# 同理这条路由不走 upstream 块，上面那些 keepalive 对它无效 —— 上行本来就是
# 一条流一个连接，影响可以忽略。
map $uri $galaxy_instance_backend {
    default              "";
    ~^/instance/hub-1/   127.0.0.1:10006;
    # ~^/instance/hub-2/   10.0.0.12:10006;
    # ~^/instance/hub-3/   10.0.0.13:10006;
}

server {
    listen      80;
    listen      [::]:80;
    server_name www.galaxy.rodeo galaxy.rodeo;

    # 证书续签放行，其余全部跳 https
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.galaxy.rodeo$request_uri; }
}

# 裸域只做跳转。证书签的是 www，裸域直连会先报证书名不匹配，
# 想让 galaxy.rodeo 也能直接打开得换带 SAN 的证书。
server {
    # http2 写在 listen 上：独立的 `http2 on;` 指令要 nginx >= 1.25.1，
    # 线上是 1.22.x，用那个写法会 emerg unknown directive。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name galaxy.rodeo;

    ssl_certificate     /data/app/nginx/key/www.galaxy.rodeo.pem;
    ssl_certificate_key /data/app/nginx/key/www.galaxy.rodeo.key;

    return 301 https://www.galaxy.rodeo$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.galaxy.rodeo;

    ssl_certificate           /data/app/nginx/key/www.galaxy.rodeo.pem;
    ssl_certificate_key       /data/app/nginx/key/www.galaxy.rodeo.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;

    access_log /var/log/nginx/galaxy.access.log;
    error_log  /var/log/nginx/galaxy.error.log;

    client_max_body_size 32m;

    gzip            on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 全站公共代理头。这里没有 WebSocket（Hub 走 SSE / chunked），
    # Connection 置空是为了让上游 keepalive 真正生效。
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;

    # ---------- Hub：SDK /v1/*、bridge /agent/v1/* ----------
    location ^~ /hub-api/ {
        proxy_pass http://galaxy_hub/;

        # 节点上行和模型响应都是长流，nginx 一攒就变成"用量记 0"那类问题
        proxy_request_buffering   off;
        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding on;

        client_max_body_size  0;      # 0 = 不限；请求体不缓冲，靠上游自己兜
        proxy_connect_timeout 30s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }
    location = /hub-api { return 301 /hub-api/; }

    # ---------- 实例定向：/instance/<名>/... → 只发给那一台 ----------
    # 表里没有的名字回 404，不要退化成轮询 —— 轮询到的那台接不住这条流，
    # 症状是概率性的消费者超时，比一个干脆的 404 难查得多。
    location ~ ^/instance/[A-Za-z0-9_.-]+(/.*)$ {
        # 先把尾巴存进变量：if 会重置正则捕获，$1 在它之后就不可靠了。
        set $galaxy_instance_path $1;
        if ($galaxy_instance_backend = "") { return 404; }
        proxy_pass http://$galaxy_instance_backend$galaxy_instance_path$is_args$args;

        # 和 /hub-api/ 同样的一套：这条就是节点上行本身，攒一下就毁了流式
        proxy_request_buffering   off;
        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding on;

        client_max_body_size  0;
        proxy_connect_timeout 30s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }

    # ---------- Nova 共享端控制台 ----------
    location ^~ /nova/api/ {
        proxy_pass http://galaxy_api/api/;   # /nova/api/xx → /api/xx
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
    location ^~ /nova/ { proxy_pass http://galaxy_nova; }
    location =  /nova  { proxy_pass http://galaxy_nova; }

    # ---------- Orbit 使用端控制台 ----------
    location ^~ /orbit/api/ {
        proxy_pass http://galaxy_consumer/api/;   # /orbit/api/xx → /api/xx
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
    location ^~ /orbit/ { proxy_pass http://galaxy_orbit; }
    location =  /orbit  { proxy_pass http://galaxy_orbit; }

    # ---------- 支付回调：渠道回调不带 /orbit 前缀，直连使用端服务 ----------
    location ^~ /galaxy/payments/ { proxy_pass http://galaxy_consumer; }

    # ---------- 门户（含它自己的 /api/galaxy/portal/*）----------
    location / { proxy_pass http://galaxy_portal; }

    # 三个服务都暴露 /metrics，别让它出公网
    location = /metrics { return 404; }
}
