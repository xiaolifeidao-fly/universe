# www.galaxy.rodeo —— Galaxy 单域名入口
#
# 证书只签了 www.galaxy.rodeo，所以三个站 + 三个服务全部挤在这一个 host 上按路径分流，
# 不能拆子域名。路径表（本机端口见 doc/deployment/galaxy-services.md 与 client/galaxy/README.md）：
#
#   /                        → Portal 门户站            127.0.0.1:17900
#   /nova/                   → Nova 共享端控制台        127.0.0.1:17898   ※ 需 basePath=/nova
#   /orbit/                  → Orbit 使用端控制台       127.0.0.1:17899   ※ 需 basePath=/orbit
#   /api/galaxy/provider/    → galaxy-api               127.0.0.1:10004
#   /api/galaxy/consumer/    → galaxy-consumer-api      127.0.0.1:10005
#   /api/galaxy/portal/      → galaxy-consumer-api      127.0.0.1:10005
#   /galaxy/payments/        → galaxy-consumer-api      127.0.0.1:10005
#   /hub-api/v1/             → galaxy-hub-api           127.0.0.1:10006   ※ 去掉 /hub-api 再转发
#   /hub-api/agent/v1/       → galaxy-hub-api           127.0.0.1:10006   ※ 同上
#   /v1/                     → galaxy-hub-api           127.0.0.1:10006   ※ 不带前缀的老地址，仍然认
#   /agent/v1/               → galaxy-hub-api           127.0.0.1:10006   ※ 同上
#   /instance/<名>/          → 指定的那一台 Hub          见「实例定向路由」，单实例用不到
#
# ========== 为什么 API 按第三段分流，而不是 /nova/api/ ==========
#
# 三个前端的 axios 都写死 baseURL: "/api"（client/galaxy/*/src/utils/axios.ts），
# 那是**绝对路径** —— 浏览器发出的永远是 https://www.galaxy.rodeo/api/...，
# 不带 basePath。所以 /nova/api/ 这类 location 一辈子不会被命中，控制台的请求
# 只会落到 /api 上；真写成那样，请求会顺着 location / 掉进门户站，
# 症状是控制台一片 404 而门户的日志里全是陌生路径。
#
# 好在三个服务的路径第三段天然不重叠（provider / consumer / portal，连登录都分开：
# galaxy-common/auth/handler.go 注册的是 /<side>/auth），按第三段分流就够，
# 一条 rewrite 都不用写。下面这几条 proxy_pass **都不带 URI 部分** —— 带了就会改写
# 路径，而这里恰恰要原样透传：Go 服务自己就挂在 /api/galaxy/... 上。
#
# 也因此，两个控制台的 Next 自带 pages/api/[...all] 代理在 Web 部署下是闲置的
# （它只有在 webview 独占一个 host 根目录时才会被打到，比如桌面壳里）。
#
# ========== basePath 必须是构建期开关 ==========
#
# 两个控制台的同一份 next build 还要打进桌面壳（Nova.app / Orbit.app），那边跑在
# 127.0.0.1:17898 / 17899 的**根**上，带 basePath 会把壳子的健康探测
# （${origin}/api/desktop-health）打成 404。所以 next.config.mjs 里要写成
#
#   basePath: process.env.GALAXY_BASE_PATH || undefined,
#
# Web 构建时才注入 GALAXY_BASE_PATH=/nova（或 /orbit）。门户在 / 上，不需要 basePath。
# 加了 basePath 之后静态资源变成 /nova/_next/...，被 location ^~ /nova/ 一并接住，
# 不需要为 /_next/ 单开路由。
#
# 安装：放到 /etc/nginx/conf.d/www.galaxy.rodeo.conf
#      nginx -t && systemctl reload nginx

upstream galaxy_portal   { server 127.0.0.1:17900; keepalive 32; }
upstream galaxy_nova     { server 127.0.0.1:17898; keepalive 32; }
upstream galaxy_orbit    { server 127.0.0.1:17899; keepalive 32; }
upstream galaxy_api      { server 127.0.0.1:10004; keepalive 32; }
upstream galaxy_consumer { server 127.0.0.1:10005; keepalive 32; }
upstream galaxy_hub      { server 127.0.0.1:10006; keepalive 32; }

# ---------- 实例定向路由 ----------
#
# 单实例部署用不到这一段，但留着不碍事：galaxy.instance 填成
# https://www.galaxy.rodeo 时，streamURL 落的是下面的 /agent/v1/，这条路由不会被命中。
#
# Hub 多实例时，节点的上行（stream）必须回到**持有消费者连接的那一个进程** ——
# 消费者的连接活在那台的内存里（响应字节不进 Redis），落到别的实例就是 ErrNotAttached，
# 消费者干等到 attach_timeout。所以这一跳不能轮询，ip_hash 之类的粘滞也救不了：
# 要钉住的是「哪条请求」，而消费者和节点是两个不同的客户端、两个不同的 IP。
#
# 路由信息由 Hub 自己写进 URL —— 它把 galaxy.instance 拼进派给节点的 streamURL，
# nginx 只需按 /instance/<名>/ 这一段把请求送到对应那台。
# 加一台机器 = 这张表加一行 + 那台的 galaxy.instance 里换个名字（其余三条配置不动）。
#
# 那边配成 https://www.galaxy.rodeo/instance/{hostname} 的话（{hostname} 由 Hub 启动时
# 替换成本机主机名短名），三台的配置文件可以完全一样；也可以用环境变量 GALAXY_INSTANCE 注入。
#
# 匹配 $uri 而不是在 location 里 set 一个变量再喂给 map：map 是惰性求值的，
# 先 set 后引用在某些顺序下会拿到缓存的旧值，直接匹配 $uri 没有这个坑。
#
# 表里填 IP:端口。填主机名的话，因为 proxy_pass 带了变量，nginx 会在运行时解析，
# 那就必须在 server 里加一条 resolver，否则启动就报 "no resolver defined"。
# 同理这条路由不走 upstream 块，上面那些 keepalive 对它无效 —— 上行本来就是
# 一条流一个连接，影响可以忽略。
map $uri $galaxy_instance_backend {
    default              "";
    ~^/instance/hub-1/   127.0.0.1:10006;
    # ~^/instance/hub-2/   10.0.0.12:10006;
    # ~^/instance/hub-3/   10.0.0.13:10006;
}

server {
    listen      80;
    listen      [::]:80;
    server_name www.galaxy.rodeo galaxy.rodeo;

    # 证书续签放行，其余全部跳 https
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.galaxy.rodeo$request_uri; }
}

# 裸域只做跳转。证书签的是 www，裸域直连会先报证书名不匹配，
# 想让 galaxy.rodeo 也能直接打开得换带 SAN 的证书。
server {
    # http2 写在 listen 上：独立的 `http2 on;` 指令要 nginx >= 1.25.1，
    # 线上是 1.22.x，用那个写法会 emerg unknown directive。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name galaxy.rodeo;

    ssl_certificate     /data/app/nginx/key/www.galaxy.rodeo.pem;
    ssl_certificate_key /data/app/nginx/key/www.galaxy.rodeo.key;

    return 301 https://www.galaxy.rodeo$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.galaxy.rodeo;

    ssl_certificate           /data/app/nginx/key/www.galaxy.rodeo.pem;
    ssl_certificate_key       /data/app/nginx/key/www.galaxy.rodeo.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;

    access_log /var/log/nginx/galaxy.access.log;
    error_log  /var/log/nginx/galaxy.error.log;

    client_max_body_size 32m;

    gzip            on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # 不含 text/event-stream：压缩会攒数据，SSE 攒一下就不是流了
    gzip_types      text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 全站公共代理头。这里没有 WebSocket（Hub 走 SSE / chunked），
    # Connection 置空是为了让上游 keepalive 真正生效。
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;

    # ---------- Hub：SDK /v1/*、节点 /agent/v1/*，都可带 /hub-api 前缀 ----------
    #
    # 这两条就是 Hub 对外的全部路由，它不挂在 /api 下面。合成一个 location 而不是
    # 写成两个 ^~，是为了让下面那套「关缓冲」的参数只有一份 —— 抄两遍迟早改一处忘一处，
    # 而忘掉的那一处的症状是流式变成一次性吐出、用量记 0，极难回溯。同理，带前缀的
    # 那两条也塞进这同一个 location，而不是另开一个「把 /hub-api/ 整段 proxy_pass 过去」。
    #
    # ========== 为什么前缀要在这里剥掉，而不是让 Hub 自己挂在 /hub-api 下 ==========
    #
    # 对外地址是 https://www.galaxy.rodeo/hub-api（配置里的 galaxy.provider_hub_url、
    # galaxy.consumer_base_url、galaxy.instance 都带这一段），而 Go 服务注册的路由是
    # /v1/... 与 /agent/v1/...，没有前缀。所以这一跳必须改写路径 —— 这也是本文件里
    # **唯一**一条改写路径的 proxy_pass，别的都是原样透传。
    #
    # 前缀写成可选分组、再用 rewrite 剥掉，于是带不带都落到同一套参数上：
    # 不带前缀的是老地址（已经签出去的密钥、已经配对过的节点还在用它），留着不摘。
    #
    # ========== 为什么是白名单，不是把 /hub-api/ 整段代理过去 ==========
    #
    # `location ^~ /hub-api/ { proxy_pass http://galaxy_hub/; }` 看着更短，但那样
    # /hub-api/metrics、/hub-api/healthz、/hub-api/readyz 会一起漏到公网 ——
    # 本文件末尾那条 `location = /metrics { return 404; }` 只挡得住根路径。
    # 这里只放行 Hub 真正对外的那两段，加新路由要顺手改这个正则。
    #
    # 正则 location 的优先级低于上面所有 ^~，但这四条都不与任何 ^~ 前缀重叠，
    # 所以这里稳稳命中；它高于 location /，门户不会截胡。
    #
    # 多实例的「实例定向路由」在上面，仍然只认不带前缀的 /instance/<名>/ ——
    # 那个地址是 Hub 自己拼进 streamURL 的，不经过这里。
    location ~ ^(/hub-api)?/(v1|agent/v1)/ {
        # break：改完路径就留在本 location，不要再去重新挑一次 location。
        # proxy_pass 不带 URI 部分，所以它转发的是改写之后的 $uri；query string
        # 由 nginx 自动接上（替换串里没有 ?）。
        rewrite ^/hub-api(/.*)$ $1 break;
        proxy_pass http://galaxy_hub;

        # 节点上行和模型响应都是长流，nginx 一攒就变成「用量记 0」那类问题
        proxy_request_buffering   off;
        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding on;

        client_max_body_size  0;      # 0 = 不限；请求体不缓冲，靠上游自己兜
        proxy_connect_timeout 30s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }

    # 裸前缀不是路由（Hub 的根上什么都没有），但别让它掉进 location / ——
    # 门户回的是自己的 404 **HTML**，和「nginx 上根本没有 /hub-api 这条 location」
    # 长得一模一样，而那正是上一次查了很久的假象。这里回一句能自证的 JSON：
    # 看到它就说明前缀是通的，只是地址还差 /v1/ 或 /agent/v1/ 那一段。
    location ~ ^/hub-api/?$ {
        default_type application/json;
        return 404 '{"error":"Hub 对外只有 /hub-api/v1/ 与 /hub-api/agent/v1/ 两段"}';
    }

    # ---------- 实例定向：/instance/<名>/... → 只发给那一台 ----------
    # 表里没有的名字回 404，不要退化成轮询 —— 轮询到的那台接不住这条流，
    # 症状是概率性的消费者超时，比一个干脆的 404 难查得多。
    location ~ ^/instance/[A-Za-z0-9_.-]+(/.*)$ {
        # 先把尾巴存进变量：if 会重置正则捕获，$1 在它之后就不可靠了。
        set $galaxy_instance_path $1;
        if ($galaxy_instance_backend = "") { return 404; }
        proxy_pass http://$galaxy_instance_backend$galaxy_instance_path$is_args$args;

        # 和上面 Hub 同样的一套：这条就是节点上行本身，攒一下就毁了流式
        proxy_request_buffering   off;
        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding on;

        client_max_body_size  0;
        proxy_connect_timeout 30s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }

    # ---------- 后端 API：按第三段分流，原样透传 ----------
    # proxy_pass 一律不带 URI 部分，路径不做任何改写。
    location ^~ /api/galaxy/provider/ { proxy_pass http://galaxy_api; }
    location ^~ /api/galaxy/consumer/ { proxy_pass http://galaxy_consumer; }
    location ^~ /api/galaxy/portal/   { proxy_pass http://galaxy_consumer; }

    # /api/galaxy/ 下就这三组，别的一律 404。
    # 不加这条的话，写错的路径会顺着 location / 掉进门户站，再被门户自己的
    # pages/api/[...all] 转给 10005 —— 一个 provider 的请求悄悄打到使用端服务上，
    # 返回的是「未登录」而不是「路径不存在」，查起来会绕很远。
    location ^~ /api/galaxy/ { return 404; }

    # ---------- 支付渠道回调 ----------
    # 它不在 /api 下，也不带用户鉴权 —— 打过来的是渠道服务器，身份靠报文签名
    # （见 galaxy-consumer-api/pkg/consumers/handler.go 的 RegisterCallbacks）。
    # 没接真渠道时这组路由在 Go 侧压根不注册，这条 location 空转，无害。
    location ^~ /galaxy/payments/ { proxy_pass http://galaxy_consumer; }

    # ---------- Nova 共享端控制台（basePath=/nova）----------
    location ^~ /nova/ { proxy_pass http://galaxy_nova; }
    location =  /nova  { proxy_pass http://galaxy_nova; }

    # ---------- Orbit 使用端控制台（basePath=/orbit）----------
    location ^~ /orbit/ { proxy_pass http://galaxy_orbit; }
    location =  /orbit  { proxy_pass http://galaxy_orbit; }

    # ---------- 门户 ----------
    # 门户的整站数据是 RSC 在服务端直接打 10005 取的（SERVER_TARGET），不经这里；
    # 走浏览器的只有联系表单 POST /api/galaxy/portal/leads，上面已单独分流。
    location / { proxy_pass http://galaxy_portal; }

    # 三个服务都暴露 /metrics，别让它出公网
    location = /metrics { return 404; }
}
